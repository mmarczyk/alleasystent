name: Deploy AlleAsystent Backend to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '.github/workflows/deploy-chat.yml'
      - 'Dockerfile.jobs'
      - 'requirements-jobs.txt'
      - 'jobs/**'
      - '.github/workflows/deploy-jobs.yml'
  workflow_dispatch:

# Only one deploy per branch may run at a time. Without this, two pushes to
# main in quick succession build in parallel, and if the OLDER commit's build
# happens to finish LAST (e.g. a cold Docker layer cache), its `gcloud run
# deploy` step runs after the newer one and silently overwrites it — Cloud
# Run ends up serving older code than what's on main. Cancelling the
# in-progress run when a newer push arrives means only the latest commit's
# deploy ever reaches the `gcloud run deploy` step.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGION: europe-central2
  SERVICE: alleasystent
  REGISTRY: europe-central2-docker.pkg.dev

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate with a service account key stored in GitHub Secrets.
      # Required secret: GCP_SA_KEY — JSON key of a service account with roles:
      #   - Artifact Registry Writer
      #   - Cloud Run Developer
      #   - Service Account User (on alleasystent-sa)
      # Required variable: GCP_PROJECT_ID — your GCP project ID
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHA layer cache: pip packages and the ~400 MB HuggingFace model are
      # cached between runs.  A code-only change skips both expensive layers.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/alleasystent/app:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/alleasystent/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Required GitHub repo variable: VAPID_EMAIL — mailto: contact for Web Push
      # (RFC 8292). Required Secret Manager secrets: vapid-private-key,
      # vapid-public-key — generate with `python generate_vapid_keys.py` and add
      # via `gcloud secrets versions add`. See deployment/setup_gcp.sh.
      #
      # analytics-allowed-emails (Secret Manager) + ANALYTICS_GOOGLE_CLIENT_ID /
      # ANALYTICS_FRONTEND_URL (repo variables, not secret) gate
      # /admin/analytics + /admin/analytics/analyze via Google Sign-In. The
      # dashboard itself lives in the alleasystent-analytics repo (GitHub
      # Pages) and must use a Google OAuth Client ID matching
      # ANALYTICS_GOOGLE_CLIENT_ID here. See deployment/setup_gcp.sh.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/alleasystent/app:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --update-secrets=GOOGLE_API_KEY=google-api-key:latest,ALLEGRO_CLIENT_ID=allegro-client-id:latest,ALLEGRO_CLIENT_SECRET=allegro-client-secret:latest,REDIS_URL=redis-url:latest,JWT_SECRET=jwt-secret:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest,VAPID_PUBLIC_KEY=vapid-public-key:latest,INFAKT_API_KEY=infakt-api-key:latest,ANALYTICS_ALLOWED_EMAILS=analytics-allowed-emails:latest \
            --remove-secrets=FACEBOOK_PAGE_ACCESS_TOKEN,FACEBOOK_APP_SECRET \
            --update-env-vars=APP_ENV=production,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},RAG_BACKEND=chromadb,FRONTEND_URL=${{ vars.FRONTEND_URL }},VAPID_EMAIL=${{ vars.VAPID_EMAIL }},ANALYTICS_GOOGLE_CLIENT_ID=${{ vars.ANALYTICS_GOOGLE_CLIENT_ID }},ANALYTICS_FRONTEND_URL=${{ vars.ANALYTICS_FRONTEND_URL }}
